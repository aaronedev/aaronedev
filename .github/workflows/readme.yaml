---
# .github/workflows/readme.yaml
name: Update README
"on":
  schedule:
  - cron: "0 8 * * *" # 10:00 Europe/Berlin (CEST) — GitHub cron is UTC; shifts +1h when CET applies
  - cron: "0 13 * * *" # 15:00 Europe/Berlin (CEST)
  - cron: "0 17 * * *" # 19:00 Europe/Berlin (CEST)
  workflow_dispatch: {}
concurrency:
  group: readme-update
  cancel-in-progress: true
jobs:
  update:
    runs-on: ${{ fromJSON(vars.OPS_SECRET_RUNNER_LABELS || '["self-hosted","Linux","X64","aed-ops"]') }}
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      with:
        fetch-depth: 0
    - name: Sync main
      run: git pull --ff-only origin main
    - name: Render README
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
        WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
      run: python3 scripts/render_readme.py
    - name: Commit and push updates
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |-
        set -euo pipefail

        if git diff --quiet HEAD -- README.md; then
          echo "README already up to date."
          exit 0
        fi

        git config user.name "readme-scribe 🤖"
        git config user.email "actions@github.com"

        git add README.md
        git commit -m "chore: update README from template"

        if ! git pull --rebase --autostash --strategy-option=ours origin main; then
          echo "Rebase failed, aligning with latest origin/main" >&2
          git rebase --abort || true
          git fetch origin main
          git reset --soft origin/main

          if git diff --cached --quiet; then
            echo "Template already matches remote after soft reset. Nothing to push."
            exit 0
          fi

          git commit -m "chore: update README from template"
        fi

        git push origin HEAD:main
